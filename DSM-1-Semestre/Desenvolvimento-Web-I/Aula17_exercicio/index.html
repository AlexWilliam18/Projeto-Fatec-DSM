<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="form">
        <h1>Inscrição Hipercurso do Prof.Junior</h1>
        <form action="#" method="post">

            <label for="nome">Nome Completo:</label>
            <br>
            <input type="text" name="nome">

            <br><br>
            <label for="email">Email:</label>
            <br>
            <input type="email" name="email">

            <br><br>
            <label for="escolaridade">Escolaridade:</label>
            <br>
            <select name="escolaridade">
                <option value="em">Ensino Médio</option>
                <option value="nt">Nível Técnico</option>
                <option value="ns">Nível Superior</option>
            </select>

            <br><br>
            <label for="periodo">Período de estudo preferido:</label>
            <br>
            <input type="radio" name="periodo" value="1"> Manhã
            <input type="radio" name="periodo" value="2"> Tarde
            <input type="radio" name="periodo" value="3"> Noite
            <br><br>

            <label for="curso">Curso desejado:</label>
            <br>
            <input type="checkbox" name="curso" value="py"> Python
            <input type="checkbox" name="curso" value="html_css"> HTML e CSS
            <input type="checkbox" name="curso" value="php_mysql"> PHP e MySQL
            <input type="checkbox" name="curso" value="github"> Github
            <br><br>

            <label for="mensagem">Por que fazer este curso?</label>
            <br>
            <textarea name="mensagem" cols="30" rows="5"></textarea>

            <fieldset>
                <legend>Criação de login</legend>
                <label for="usuario">Usuário:</label>
                <br>
                <input type="text" name="usuario">
                <br>
                <label for="senha">Senha:</label>
                <br>
                <input type="text" name="senha" size="10" maxlength="">
           </fieldset>

            <br><br>
            <input type="submit" value="Enviar inscrição">
           
        </form>
    </div>
</body>
</html>
